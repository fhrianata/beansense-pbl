server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ============================================================
    # Static assets — serve langsung dari nginx, sangat cepat
    # ============================================================
    location /css/ {
        alias /usr/share/nginx/html/css/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    location /js/ {
        alias /usr/share/nginx/html/js/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    location /img/ {
        alias /usr/share/nginx/html/img/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    location /fonts/ {
        alias /usr/share/nginx/html/fonts/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ============================================================
    # API Proxy → API Gateway (port 9000)
    # Semua /api/* diteruskan ke api-gateway kecuali notification
    # ============================================================
    location /api/ {
        proxy_pass         http://api-gateway:9000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;

        # Timeout wajar untuk request sensor
        proxy_connect_timeout 5s;
        proxy_read_timeout    10s;
    }

    # ============================================================
    # Health check nginx
    # ============================================================
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # ============================================================
    # Halaman HTML — semua route SPA-style
    # ============================================================
    location / {
        root  /usr/share/nginx/html/html;
        index index.html;
        try_files $uri $uri.html $uri/ /index.html =404;
    }

    server_tokens off;
}
