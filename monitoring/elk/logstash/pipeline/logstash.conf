input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # Tambahkan field tanggal yang konsisten, ambil dari timestamp aplikasi kalau ada
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    # 1 index per service per hari, gampang dicari & dihapus kalau penuh
    index => "beansense-%{[service]}-%{+YYYY.MM.dd}"
  }

  # Aktifkan baris ini sementara kalau mau debug pipeline di terminal
  # stdout { codec => rubydebug }
}
