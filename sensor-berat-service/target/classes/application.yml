server:
  port: 8085
  address: 0.0.0.0

spring:
  application:
    name: SENSOR-BERAT-SERVICE

  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:3306/beansense?useSSL=false&serverTimezone=Asia/Jakarta&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:bean123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 5
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

sensor:
  api-key: ${SENSOR_API_KEY:BEANSENSE123}
