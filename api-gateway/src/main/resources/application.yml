server:
  port: 9000
  address: 0.0.0.0

spring:
  application:
    name: API-GATEWAY

  cloud:
    gateway:
      trustedProxies: ".*"
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: auth-service
          uri: http://auth-service:8082
          predicates:
            - Path=/api/auth/**, /api/users/**

        - id: sensor-warna-service
          uri: http://sensor-warna-service:8083
          predicates:
            - Path=/api/sensor-warna/**

        - id: sensor-berat-service
          uri: http://sensor-berat-service:8085
          predicates:
            - Path=/api/sensor-berat/**

        - id: notification-service
          uri: http://notification-service:8086
          predicates:
            - Path=/api/notification/**

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
